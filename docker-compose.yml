version: '3.8'

services:
  oracle-node:
    build:
      context: .
      dockerfile: Dockerfile
    image: nearacles-oracle:latest
    container_name: nearacles-oracle-node
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - nearacles-network

networks:
  nearacles-network:
    driver: bridge
